name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q

  loop:
    name: Optional Loop / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Core and optional extension
        run: python -m pip install -e '.[dev]' -e ./extensions/sciharness-loop
      - name: Lint extension
        run: python -m ruff check extensions/sciharness-loop
      - name: Backend, budget, scheduling, recovery, and distribution tests
        run: python -m pytest -q extensions/sciharness-loop/tests --ignore=extensions/sciharness-loop/tests/test_docker.py

  loop-isolation:
    name: Optional Loop / enforced Docker isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]' -e ./extensions/sciharness-loop
      - name: Exercise all backends, isolation, and orphan deadlines
        env:
          SCI_LOOP_TEST_DOCKER: "1"
        run: python -m pytest -q extensions/sciharness-loop/tests/test_docker.py

  loop-dsh-image:
    name: Optional Loop / DSH headless image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production DSH image
        run: docker build -f extensions/sciharness-loop/Dockerfile.dsh -t sciharness-dsh:test extensions/sciharness-loop
      - name: Verify the DSH CLI and initialized headless profile
        run: |
          docker run --rm --entrypoint dsh sciharness-dsh:test --version
          docker run --rm --entrypoint dsh sciharness-dsh:test --profile headless --help
      - name: Verify the read-only skill provider patch composes
        run: |
          cat > /tmp/skill-patch.yml <<'EOF'
          - id: skill-filesystem
            config:
              customSkillDirs:
                - "/input/project/.agents/skills"
          EOF
          docker run --rm --entrypoint dsh -v /tmp/skill-patch.yml:/tmp/skill-patch.yml \
            sciharness-dsh:test --profile headless --patch /tmp/skill-patch.yml --dump-config \
            | grep -q customSkillDirs
      - name: Build the MCP allowlist test image
        run: |
          cp extensions/sciharness-loop/src/sciharness_loop/mcp_proxy.py \
            extensions/sciharness-loop/tests/fixtures/mcp_proxy.py
          docker build -f extensions/sciharness-loop/tests/fixtures/Dockerfile.dsh-mcp \
            -t sciharness-dsh-mcp:test extensions/sciharness-loop/tests/fixtures
      - name: Verify the MCP proxy starts under the real headless profile
        run: |
          cat > /tmp/mcp-patch.yml <<'EOF'
          - insert:
              - id: mcp-fixture
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: fixture
                  transport: stdio
                  command: python3
                  args: ["/opt/sciharness/mcp_proxy.py", "/tmp/mcp-fixture.json"]
                  failOnStartupError: true
                  toolCallTimeoutMs: 5000
          EOF
          cat > /tmp/mcp-fixture.json <<'EOF'
          {"command": ["python3", "/opt/sciharness/mcp_fixture_server.py"], "env": [], "tools": ["lookup"], "timeout_seconds": 5}
          EOF
          docker run --rm -v /tmp/mcp-patch.yml:/tmp/mcp-patch.yml \
            -v /tmp/mcp-fixture.json:/tmp/mcp-fixture.json \
            --entrypoint dsh sciharness-dsh-mcp:test --profile headless \
            --patch /tmp/mcp-patch.yml --help
