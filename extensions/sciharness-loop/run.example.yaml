schema_version: 1
objective: >-
  Investigate whether coverage filtering changes a diagnostic association on
  the authorized pilot subset. Preserve exact commands, failed checks, and
  preliminary findings for morning review.
constraints:
  - Use only the selected inputs and authorized read-only dataset mounts.
  - Run exploratory diagnostics and small pilots; do not change frozen protocols.
  - Stop and request approval if a new dataset or formal experimental design is needed.
