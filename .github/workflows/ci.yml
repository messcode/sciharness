name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q

  loop:
    name: Optional Loop / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Core and optional extension
        run: python -m pip install -e '.[dev]' -e ./extensions/sciharness-loop
      - name: Lint extension
        run: python -m ruff check extensions/sciharness-loop
      - name: Unit, integration, recovery, and distribution tests
        run: python -m pytest -q extensions/sciharness-loop/tests --ignore=extensions/sciharness-loop/tests/test_docker.py

  loop-isolation:
    name: Optional Loop / enforced Docker isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]' -e ./extensions/sciharness-loop
      - name: Exercise production launcher with adversarial containers
        env:
          SCI_LOOP_TEST_DOCKER: "1"
        run: python -m pytest -q extensions/sciharness-loop/tests/test_docker.py
