[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciharness"
dynamic = ["version"]
description = "A lightweight, cross-agent scientific research harness."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["science", "research", "reproducibility", "agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=5.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "setuptools>=68", "build>=1.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/messcode/sciharness"
Changelog = "https://github.com/messcode/sciharness/blob/main/CHANGELOG.md"

[project.scripts]
sci = "sciharness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "sciharness.__version__"}

[tool.setuptools.package-data]
sciharness = [
  "templates/project/.gitignore",
  "templates/project/*.md",
  "templates/project/docs/*.md",
  "templates/project/docs/guides/*.md",
  "templates/project/data/*.md",
  "templates/project/data/*.yaml",
  "templates/figure/*.md",
  "templates/figure/*.yaml",
  "resources/skills/*/*.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
